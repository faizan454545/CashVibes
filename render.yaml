services:
  - type: web
    name: cashvibes
    runtime: php
    plan: free
    buildCommand: |
      composer install --no-dev --optimize-autoloader
      php artisan config:clear
      php artisan route:clear
      php artisan view:clear
      php artisan cache:clear
      php artisan migrate --force
    startCommand: php artisan serve --host=0.0.0.0 --port=$PORT
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        generateValue: true
      - key: APP_URL
        fromService:
          name: cashvibes
          property: url
      - key: DB_CONNECTION
        value: mysql
      - key: DB_HOST
        fromDatabase:
          name: cashvibes-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: cashvibes-db
          property: port
      - key: DB_DATABASE
        fromDatabase:
          name: cashvibes-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: cashvibes-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: cashvibes-db
          property: password
      - key: SESSION_DRIVER
        value: database
      - key: SESSION_SECURE_COOKIE
        value: "true"
      - key: SESSION_ENCRYPT
        value: "true"
      - key: CACHE_STORE
        value: database
      - key: LOG_LEVEL
        value: warning

databases:
  - name: cashvibes-db
    plan: free
    databaseName: cashvibes
